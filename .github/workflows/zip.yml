name: Zip della skill

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crea lo zip e la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(cat VERSION)
          mkdir -p "$RUNNER_TEMP/hdd-presentazioni"
          rsync -a --exclude .git --exclude .github ./ "$RUNNER_TEMP/hdd-presentazioni/"
          (cd "$RUNNER_TEMP" && zip -qr hdd-presentazioni.zip hdd-presentazioni)
          git log -1 --format='%s%n%n%b' > "$RUNNER_TEMP/note.txt"
          gh release view "v$V" >/dev/null 2>&1 || gh release create "v$V" --title "Versione $V" --notes-file "$RUNNER_TEMP/note.txt"
          gh release upload "v$V" "$RUNNER_TEMP/hdd-presentazioni.zip" --clobber
